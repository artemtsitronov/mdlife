name: Release

# Builds mdlife for Linux, Windows and macOS and publishes a GitHub Release
# on every push to main.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".gitignore"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/mdlife.exe dist/
            7z a mdlife-${{ matrix.name }}.zip ./dist/mdlife.exe
          else
            cp target/${{ matrix.target }}/release/mdlife dist/
            tar -czf mdlife-${{ matrix.name }}.tar.gz -C dist mdlife
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mdlife-${{ matrix.name }}
          path: |
            mdlife-${{ matrix.name }}.zip
            mdlife-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v${version}-build.${{ github.run_number }}"
          gh release create "$tag" artifacts/* \
            --target "${{ github.sha }}" \
            --title "mdlife $tag" \
            --generate-notes
